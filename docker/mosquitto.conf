# BWOC MQTT broker — the transport `bwoc-mqtt` publishes to and subscribes from.
#
# Anonymous access is allowed because the broker is published on 127.0.0.1 only
# (see compose.yaml). Before exposing it on a LAN, add a password_file and set
# allow_anonymous false — bwoc-mqtt supports mqtt://user:pass@host:1883.

listener 1883
allow_anonymous true

# WebSocket listener — lets a browser or the Chrome extension subscribe.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
