name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues:** do not file them here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: bwoc
    attributes:
      label: bwoc version
      description: Output of `bwoc --version`
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: "Node 22.x, Ubuntu 24.04"
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options: [pnpm dev, pnpm preview, Docker Compose, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact hostnames, tokens and paths you do not want public.
      render: shell
